<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceHub - Pencatatan Keuangan Pribadi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F17',
                        cardbg: '#161C28',
                        cardborder: '#232D3F',
                        accentcyan: '#00F5D4',
                        accentblue: '#00BBF9',
                        accentpurple: '#7B2CBF',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #232D3F; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00BBF9; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col antialiased">

    <!-- MODAL LOGIN / MASUK LOG (Tampil Pertama Kali) -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md px-4">
        <div class="bg-cardbg border border-cardborder rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-accentcyan/10 text-accentcyan mb-3">
                    <i class="fa-solid fa-wallet text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Selamat Datang</h2>
                <p class="text-xs sm:text-sm text-gray-400 mt-1">Masukkan data diri untuk memulai sesi pencatatan keuangan Anda.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="inputName" required placeholder="Contoh: Budi Santoso"
                            class="w-full bg-darkbg/80 border border-cardborder rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-accentcyan focus:ring-1 focus:ring-accentcyan transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="inputEmail" required placeholder="nama@email.com"
                            class="w-full bg-darkbg/80 border border-cardborder rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-accentcyan focus:ring-1 focus:ring-accentcyan transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full mt-2 bg-gradient-to-r from-accentcyan to-accentblue text-gray-900 font-bold py-3 px-4 rounded-xl hover:opacity-90 transition transform active:scale-95 shadow-lg shadow-accentcyan/20">
                    Masuk ke Aplikasi <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div id="appContainer" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">

        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-cardbg border-r border-cardborder p-4 flex flex-col justify-between shrink-0">
            <div>
                <!-- LOGO / BRAND -->
                <div class="flex items-center gap-3 px-2 py-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accentcyan to-accentblue flex items-center justify-center text-gray-900 font-black text-xl shadow-md">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight tracking-wide text-white">FinanceHub</h1>
                        <span class="text-[10px] uppercase font-bold text-accentcyan tracking-widest">Personal Manager</span>
                    </div>
                </div>

                <!-- USER PROFILE PROFILE BADGE -->
                <div class="bg-darkbg/60 border border-cardborder rounded-xl p-3 mb-6 flex items-center gap-3">
                    <div id="userAvatar" class="w-10 h-10 rounded-full bg-accentpurple flex items-center justify-center font-bold text-white text-sm shrink-0">
                        --
                    </div>
                    <div class="overflow-hidden">
                        <h3 id="userNameDisplay" class="text-sm font-semibold text-white truncate">--</h3>
                        <p id="userEmailDisplay" class="text-xs text-gray-400 truncate">--</p>
                    </div>
                </div>

                <!-- NAVIGATION -->
                <nav class="space-y-1">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-accentcyan bg-accentcyan/10 border border-accentcyan/20">
                        <i class="fa-solid fa-house w-5 text-center"></i> Dashboard
                    </button>
                    <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-gray-400 hover:text-white hover:bg-cardborder/40">
                        <i class="fa-solid fa-list-check w-5 text-center"></i> Transaksi
                    </button>
                    <button onclick="switchTab('activity')" id="nav-activity" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-gray-400 hover:text-white hover:bg-cardborder/40">
                        <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Activity Log
                    </button>
                </nav
